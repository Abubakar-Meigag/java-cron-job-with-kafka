services:
  # Kafka in KRaft mode — no Zookeeper needed in modern Kafka
  kafka:
    # official Apache Kafka image
    image: apache/kafka:latest
    container_name: kafka
    # expose broker to your host machine for local testing
    ports:
      - "9092:9092"
    environment:
      # KRaft requires this node to act as both broker and controller
      KAFKA_PROCESS_ROLES: broker,controller
      # unique id for this broker in the cluster
      KAFKA_NODE_ID: 1
      # who votes on cluster leadership (nodeId@host:controllerPort)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # where kafka binds: one listener for clients, one for the controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # what kafka tells clients to connect back on
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # which listener name is used for controller traffic
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # security protocol for each listener name
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # single broker, so replication of 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # your scheduler — the "producer" side, added in step 3
  scheduler:
    # build from your Dockerfile
    build: .
    depends_on:
      # don't start until kafka is up
      - kafka
    environment:
      # scheduler connects using the service name, not localhost
      KAFKA_BROKER: kafka:9092

